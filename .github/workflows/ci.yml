name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Normalise, validate, sync, test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Only for the drift reporter below, and only when a gate has already
      # failed. Widening token scope on a workflow that runs on every push is not
      # free, so it is granted at the job rather than the workflow level and
      # used by exactly one step that runs on the failure path only.
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Check normalisation (no BOM, no CRLF)
        run: scripts/normalize.sh --check

      - name: Validate every skill against the Agents Skills spec
        run: scripts/validate-skills.sh --strict

      - name: Check skill discovery roots are in sync
        run: scripts/sync-agents.sh --check

      - name: Check generated flat rule files are in sync
        run: scripts/sync-rules.sh --check

      - name: Check descriptions match the canonical set
        run: scripts/set-descriptions.sh --check

      - name: Check the documentation catalog matches the skills
        run: scripts/build-catalog-doc.sh --check

      - name: Regression-test the validator itself
        run: tests/run-tests.sh

      - name: Verify the HTTP catalog builds and lists every skill
        run: |
          scripts/build-catalog.sh
          count=$(find dist -name SKILL.md | wc -l)
          expected=$(find .opencode/skills -name SKILL.md | wc -l)
          echo "catalog: $count skill(s), source: $expected"
          test "$count" -eq "$expected"
          # level-1 progressive disclosure needs a description per entry
          grep -c '"description"' dist/index.json | grep -qx "$expected"

      - name: Report the upstream specification fingerprint
        # Informational, and deliberately not a gate. A changed upstream
        # specification is not a defect in this repository, and failing CI for it
        # would mean the signal gets ignored. The daily workflow opens an issue.
        continue-on-error: true
        run: scripts/check-upstream.sh --status

      - name: Name the drift in a tracking issue
        # A gate that fails only in a log is a gate whose failure nobody sees.
        # Logs are per-run and unlinked; an issue is durable and has history.
        # Deduplicated inside the script, so a persistent failure comments on
        # the one open issue instead of opening a new one on every push.
        #
        # This step exists partly because it is how the maintainer learns what is
        # wrong without shell access to the runner, which is the same constraint
        # any reader of this repository has.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-drift.sh