# Dependabot keeps the pinned action SHAs current.
#
# The workflows use actions/checkout pinned to a commit SHA rather than a tag,
# because a tag can be moved after it has been reviewed and a commit cannot.
# Pinning without something that moves the pin forward turns into a repository
# running a year-old action, so the pin needs an owner. That owner is this
# file.
#
# Dependabot updates both the SHA and the version comment beside it, so the
# comment never lies about which release is pinned.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
